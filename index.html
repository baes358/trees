<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NYC Street Tree Forest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="hud">
      <div id="status">loading the forest…</div>
      <div id="controls">
        <button id="new-shape" type="button">NEW TREE</button>
        <button id="reseed" type="button">RESEED</button>
        <button id="reset-view" type="button">RESET VIEW</button>
        <select id="borough">

          <option value="">ALL BOROUGHS</option>
          <option value="Manhattan">Manhattan</option>
          <option value="Brooklyn">Brooklyn</option>
          <option value="Queens">Queens</option>
          <option value="Bronx">Bronx</option>
          <option value="Staten Island">Staten Island</option>
        </select>
      </div>
    </div>
    <div id="canvas-host"></div>
    <div id="tooltip" hidden></div>
    <div id="loading">
      <div class="loading-inner">
        <div class="loading-title">growing the forest</div>
        <div class="loading-dots"><span></span><span></span><span></span></div>
        <div class="loading-sub">fetching nyc street tree census</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
