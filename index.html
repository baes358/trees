<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NYC Street Tree Forest</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="hud">
      <div id="status">loading the forest…</div>
      <div id="controls">
        <button id="new-shape" type="button">NEW TREE</button>
        <button id="reseed" type="button">RESEED</button>
        <button id="reset-view" type="button">RESET VIEW</button>
        <label class="count-control">
          <span>TREES</span>
          <input id="tree-count" type="number" min="250" max="999" step="1" value="500" />
        </label>
        <label class="bend-control">
          <span>BEND</span>
          <input id="bend" type="range" min="0.25" max="1.7" step="0.01" value="1" />
        </label>
        <select id="borough">

          <option value="">ALL BOROUGHS</option>
          <option value="Manhattan">Manhattan</option>
          <option value="Brooklyn">Brooklyn</option>
          <option value="Queens">Queens</option>
          <option value="Bronx">Bronx</option>
          <option value="Staten Island">Staten Island</option>
        </select>
      </div>
    </div>
    <div id="canvas-host"></div>
    <div id="tooltip" hidden></div>
    <div id="loading">
      <div class="loading-inner">
        <canvas class="seed-canvas" aria-hidden="true"></canvas>
        <div class="loading-title">planting the seeds</div>
        <div class="loading-sub">fetching nyc street tree census</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
