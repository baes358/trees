<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NYC Street Tree Forest</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="intro-pending">
    <div id="hud">
      <div id="status">loading the forest…</div>
      <div id="controls">
        <button id="new-shape" type="button">NEW TREE</button>
        <button id="reseed" type="button">RESEED</button>
        <button id="reset-view" type="button">RESET VIEW</button>
        <label class="count-control">
          <span>TREES</span>
          <input id="tree-count" type="number" min="250" max="999" step="1" value="500" />
        </label>
        <label class="bend-control">
          <span>BEND</span>
          <input id="bend" type="range" min="0.25" max="1.7" step="0.01" value="1" />
        </label>
        <select id="borough">

          <option value="">ALL BOROUGHS</option>
          <option value="Manhattan">Manhattan</option>
          <option value="Brooklyn">Brooklyn</option>
          <option value="Queens">Queens</option>
          <option value="Bronx">Bronx</option>
          <option value="Staten Island">Staten Island</option>
        </select>
      </div>
    </div>
    <button id="hud-toggle" type="button" aria-label="Hide controls" aria-pressed="false">
      <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
      <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10.7 5.1A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-2.4 3.4M6.6 6.6A18 18 0 0 0 2 12s3.5 7 10 7a10.6 10.6 0 0 0 4.4-.9" />
        <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
        <path d="M2 2l20 20" />
      </svg>
    </button>
    <div id="canvas-host"></div>
    <div id="toast" hidden></div>
    <div id="tooltip" hidden></div>
    <div id="loading">
      <div class="loading-inner">
        <canvas class="seed-canvas" aria-hidden="true"></canvas>
        <div class="loading-title">planting the seeds</div>
        <div class="loading-sub">fetching nyc street tree census</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
